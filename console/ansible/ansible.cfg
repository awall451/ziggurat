# Settings for the playbooks the console runs. The console sets ANSIBLE_CONFIG
# to this file; connection details come from an inventory generated per run.
[defaults]
host_key_checking = True
gathering = explicit
interpreter_python = auto_silent
retry_files_enabled = False
nocows = 1
callback_plugins = ./callback_plugins
stdout_callback = ziggurat_events
forks = 1

[ssh_connection]
pipelining = True
# No agent forwarding, no shared connection left behind after a run.
ssh_args = -o ControlMaster=no -o ForwardAgent=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10
