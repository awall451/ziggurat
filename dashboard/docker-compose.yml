# Agent Fleet dashboard. Static Svelte build + pulled agent data, served by nginx.
# Put it behind your own reverse proxy / VPN; it has no login.
services:
  fleet:
    image: nginx:alpine
    container_name: fleet
    # Default bridge: this host has no free Docker address pools for new networks.
    network_mode: bridge
    ports:
      - "8421:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ${FLEET_DATA:?set FLEET_DATA}:/usr/share/nginx/html/data:ro
    restart: unless-stopped
